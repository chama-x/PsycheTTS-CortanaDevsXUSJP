<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Audio manual Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .copy-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .copy-card:hover {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.8);
        }

        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-icon {
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
            color: #94a3b8;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .copied {
            color: #34d399 !important;
        }
    </style>
</head>

<body class="min-h-screen p-6 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2 tracking-tight gradient-text">Manual Generation Helper</h1>
            <p class="text-slate-400">Copy-paste prompts to AI Studio efficiently</p>
            <a href="https://aistudio.google.com/" target="_blank"
                class="inline-flex items-center gap-2 mt-4 text-cyan-400 hover:text-cyan-300 font-medium">
                Open AI Studio
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                    <polyline points="15 3 21 3 21 9" />
                    <line x1="10" x2="21" y1="14" y2="3" />
                </svg>
            </a>
        </div>

        <div id="batchesContainer" class="space-y-10">
            <!-- Batches Injected Here -->
        </div>
    </div>

    <script>
        const samples = [
            {
                emotion: "Happy",
                voice: "Leda",
                instructions: "Speak in a bright, uplifting, and high-energy tone. Use a smiling voice with high pitch variation.",
                texts: [
                    "මම අද ගොඩක් සතුටින්!",
                    "කොච්චර ලස්සන උදෑසනක්ද මේ!",
                    "මට අලුත් තෑග්ගක් ලැබුනා, හරිම සතුටුයි.",
                    "හැමදේම හරිම ලස්සනට සිද්ධ වෙනවා.",
                    "අපි හැමෝම එකතු වෙලා සතුටු වෙමු!"
                ]
            },
            {
                emotion: "Sad",
                voice: "Leda",
                instructions: "Speak in a slow, quiet, and breathy tone. Use a melancholic voice with a lower pitch range.",
                texts: [
                    "මට ගොඩක් පාළුයි අද.",
                    "ඇයි මට මෙහෙම වුනේ කියලා හිතාගන්න බැහැ.",
                    "මේක හරිම අඳුරු දවසක්.",
                    "මම අතරමං වෙලා වගේ දැනෙනවා.",
                    "කවුරුත් මාව තේරුම් ගන්නේ නැහැ."
                ]
            }
        ];

        const container = document.getElementById('batchesContainer');

        samples.forEach((batch, idx) => {
            const section = document.createElement('div');
            section.className = 'glass-panel rounded-2xl p-6 relative overflow-hidden';

            // Header
            section.innerHTML = `
                <div class="absolute top-0 right-0 w-32 h-32 ${batch.emotion === 'Happy' ? 'bg-yellow-500/10' : 'bg-blue-500/10'} rounded-full blur-3xl pointer-events-none"></div>
                <div class="flex justify-between items-start mb-6 border-b border-slate-700/50 pb-4">
                    <div>
                        <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                            ${batch.emotion} (${batch.voice})
                        </h2>
                        <p class="text-xs text-slate-500 uppercase tracking-wider mt-1">Batch #${idx + 1}</p>
                    </div>
                    <div class="flex flex-col gap-2 w-2/3">
                        <div class="copy-card p-3 rounded-lg flex justify-between items-start group">
                            <div>
                                <span class="text-xs text-slate-500 block mb-1">System Instructions</span>
                                <p class="text-sm text-slate-300 instruction-text">${batch.instructions}</p>
                            </div>
                            <button class="btn-icon" onclick="copyText(this, '${batch.instructions.replace(/'/g, "\\'")}')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="grid gap-4">
                    ${batch.texts.map((text, i) => {
                const filename = `${batch.emotion.toLowerCase()}_leda_${i + 1}.wav`;
                return `
                        <div class="glass-input p-4 rounded-xl flex flex-col gap-3 group border border-slate-700/50 hover:border-slate-600">
                            
                            <!-- Prompt Row -->
                            <div class="flex justify-between items-center">
                                <span class="text-slate-200 font-medium text-lg">${text}</span>
                                <button class="btn-icon bg-slate-800/50 hover:bg-indigo-600/20 hover:text-indigo-400" onclick="copyText(this, '${text}')" title="Copy Prompt">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                </button>
                            </div>

                            <!-- Metadata Row -->
                            <div class="flex items-center gap-4 border-t border-slate-700/50 pt-3">
                                <div class="flex-1 bg-slate-900/50 rounded px-3 py-2 text-xs font-mono text-slate-400 flex justify-between items-center">
                                    <span>${filename}</span>
                                    <button class="text-slate-500 hover:text-white" onclick="copyText(this, '${filename}')" title="Copy Filename">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                                    </button>
                                </div>
                                
                                <button class="btn-secondary px-4 py-2 rounded text-sm text-emerald-400 hover:bg-emerald-500/10 flex items-center gap-2" onclick="logEntry('${filename}', '${text}', '${batch.emotion}', '${batch.voice}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                    Log to CSV
                                </button>
                            </div>
                        </div>
                    `}).join('')}
                </div>
            `;
            container.appendChild(section);
        });

        async function copyText(btn, text) {
            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btn.innerHTML;

                // Visual feedback
                btn.classList.add('copied');
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = originalHTML;
                }, 1500);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        async function logEntry(filename, text, emotion, voice) {
            try {
                const response = await fetch('/api/log_csv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: filename,
                        text: text,
                        emotion: emotion,
                        voice: voice
                    })
                });

                if (response.ok) {
                    // Show global toast or success on button?
                    // Simple alert replacement for speed
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-4 right-4 bg-emerald-500 text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2';
                    toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Logged ${filename}`;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                }
            } catch (err) {
                alert("Failed to log CSV: " + err);
            }
        }
    </script>
</body>

</html>
